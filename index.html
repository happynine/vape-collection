<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Vape品牌商官网查找系统</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            dark: { 900: '#0f0f1a', 800: '#1a1a2e', 700: '#252540' }
          }
        }
      }
    }
  </script>
  <style>
    @import url('https://fonts.googleapis.cn/css2?family=Inter:wght@400;500;600;700&display=swap');
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: linear-gradient(135deg, #0f0f1a 0%, #1a1a2e 100%);
      min-height: 100vh;
    }
    .glass-card {
      background: rgba(255,255,255,0.06);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255,255,255,0.08);
    }
    .glass-card:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 32px rgba(0,0,0,0.3);
      border-color: rgba(255,255,255,0.15);
    }
    .glass-card.editing {
      border-color: rgba(239,68,68,0.4);
    }
    .glass-card.editing:hover {
      transform: none;
      box-shadow: 0 0 20px rgba(239,68,68,0.15);
    }
    .filter-btn {
      background: rgba(255,255,255,0.08);
      transition: all 0.2s ease;
    }
    .filter-btn:hover {
      background: rgba(255,255,255,0.15);
    }
    .filter-btn.active {
      background: #ffffff;
      color: #0f0f1a;
      font-weight: 600;
    }
    .letter-anchor {
      scroll-margin-top: 80px;
    }
    .modal-overlay {
      background: rgba(0,0,0,0.6);
      backdrop-filter: blur(4px);
    }
    input, select, textarea {
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.15);
      color: #fff;
      transition: border-color 0.2s;
    }
    input:focus, select:focus, textarea:focus {
      outline: none;
      border-color: #60a5fa;
      background: rgba(255,255,255,0.12);
    }
    select option {
      background: #1a1a2e;
      color: #fff;
    }
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.15); border-radius: 3px; }
    .fade-in { animation: fadeIn 0.3s ease-out; }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .logo-fallback {
      width: 48px;
      height: 48px;
      border-radius: 8px;
      background: rgba(255,255,255,0.1);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      font-weight: 700;
      color: #888;
      flex-shrink: 0;
    }
    .brand-logo {
      width: 48px;
      height: 48px;
      border-radius: 8px;
      object-fit: contain;
      background: rgba(255,255,255,0.1);
      flex-shrink: 0;
    }
    .edit-badge {
      position: absolute;
      top: -4px;
      right: -4px;
      width: 20px;
      height: 20px;
      border-radius: 50%;
      background: #ef4444;
      display: none;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      z-index: 10;
      transition: transform 0.15s;
    }
    .edit-badge:hover {
      transform: scale(1.2);
    }
    .editing .edit-badge {
      display: flex;
    }
    .edit-overlay {
      position: absolute;
      inset: 0;
      border-radius: 12px;
      background: rgba(0,0,0,0.5);
      display: none;
      align-items: center;
      justify-content: center;
      gap: 8px;
      z-index: 5;
    }
    .editing .edit-overlay {
      display: flex;
    }
  </style>
</head>
<body class="text-white">
  <div id="app" class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 pb-32">

    <!-- Header -->
    <header class="pt-10 pb-6 text-center">
      <h1 class="text-3xl sm:text-4xl font-bold tracking-tight mb-2">Vape品牌商官网查找系统</h1>
      <p class="text-gray-400 text-sm">快速查找全球 Vape 品牌官方网站信息</p>
    </header>

    <!-- Search -->
    <div class="max-w-xl mx-auto mb-6 relative">
      <svg class="absolute left-4 top-1/2 -translate-y-1/2 w-5 h-5 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/>
      </svg>
      <input
        id="searchInput"
        type="text"
        placeholder="搜索品牌名称、中文名或官网地址..."
        class="w-full pl-12 pr-4 py-3 rounded-full text-sm placeholder-gray-400"
      />
    </div>

    <!-- A-Z Filter -->
    <div class="mb-4 overflow-x-auto pb-2">
      <div id="letterFilter" class="flex gap-1.5 justify-center flex-wrap">
        <button class="filter-btn px-2.5 py-1 rounded-md text-xs text-gray-300 active" data-letter="">全部</button>
      </div>
    </div>

    <!-- Region Filter -->
    <div class="mb-8 overflow-x-auto pb-2">
      <div id="regionFilter" class="flex gap-2 justify-center flex-wrap">
      </div>
    </div>

    <!-- Edit Mode Banner -->
    <div id="editBanner" class="hidden mb-4 p-3 rounded-lg bg-red-500/20 border border-red-500/40 text-sm text-red-300 flex items-center gap-2">
      <svg class="w-5 h-5 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.232 5.232l3.536 3.536m-2.036-5.036a2.5 2.5 0 113.536 3.536L6.5 21.036H3v-3.572L16.732 3.732z"/>
      </svg>
      编辑模式：点击卡片上的按钮可编辑或删除品牌
    </div>

    <!-- Brand Count -->
    <div class="mb-4 text-sm text-gray-400" id="brandCount"></div>

    <!-- Brand Cards Container -->
    <div id="brandList" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-4">
    </div>

    <!-- Empty State -->
    <div id="emptyState" class="hidden text-center py-20 text-gray-500">
      <svg class="w-16 h-16 mx-auto mb-4 opacity-50" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M9.172 16.172a4 4 0 015.656 0M9 10h.01M15 10h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/>
      </svg>
      <p class="text-lg">未找到匹配的品牌</p>
      <p class="text-sm mt-1">请尝试其他搜索条件</p>
    </div>

    <!-- Bottom Action Buttons -->
    <div class="fixed bottom-0 left-0 right-0 z-40">
      <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 pb-6 pt-4">
        <div class="flex gap-3 justify-center">
          <button
            id="addBtn"
            class="flex items-center gap-2 px-6 py-3 rounded-xl bg-blue-500 hover:bg-blue-600 text-white shadow-lg shadow-blue-500/25 transition-all hover:scale-105 text-sm font-medium"
          >
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M12 4v16m8-8H4"/>
            </svg>
            添加
          </button>
          <button
            id="editBtn"
            class="flex items-center gap-2 px-6 py-3 rounded-xl bg-white/10 hover:bg-white/15 text-white border border-white/10 shadow-lg transition-all hover:scale-105 text-sm font-medium"
          >
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.232 5.232l3.536 3.536m-2.036-5.036a2.5 2.5 0 113.536 3.536L6.5 21.036H3v-3.572L16.732 3.732z"/>
            </svg>
            <span id="editBtnText">编辑</span>
          </button>
          <button
            id="exportBtn"
            class="flex items-center gap-2 px-6 py-3 rounded-xl bg-green-600 hover:bg-green-700 text-white shadow-lg shadow-green-500/25 transition-all hover:scale-105 text-sm font-medium"
          >
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"/>
            </svg>
            导出数据
          </button>
        </div>
      </div>
    </div>
  </div>

  <!-- Add/Edit Brand Modal -->
  <div id="brandModal" class="fixed inset-0 modal-overlay z-50 hidden items-center justify-center p-4">
    <div class="glass-card rounded-2xl p-6 w-full max-w-md fade-in">
      <div class="flex items-center justify-between mb-6">
        <h2 id="modalTitle" class="text-xl font-semibold">添加品牌</h2>
        <button id="closeModal" class="text-gray-400 hover:text-white transition-colors">
          <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
          </svg>
        </button>
      </div>
      <form id="brandForm" class="space-y-4">
        <input type="hidden" id="formEditId" value="" />
        <div>
          <label class="block text-sm text-gray-300 mb-1.5">英文名 <span class="text-red-400">*</span></label>
          <input id="formNameEn" type="text" required class="w-full px-3 py-2.5 rounded-lg text-sm" placeholder="如: RELX" />
        </div>
        <div>
          <label class="block text-sm text-gray-300 mb-1.5">中文名</label>
          <input id="formNameCn" type="text" class="w-full px-3 py-2.5 rounded-lg text-sm" placeholder="如: 悦刻" />
        </div>
        <div>
          <label class="block text-sm text-gray-300 mb-1.5">官网地址 <span class="text-red-400">*</span></label>
          <input id="formUrl" type="url" required class="w-full px-3 py-2.5 rounded-lg text-sm" placeholder="https://example.com" />
        </div>
        <div>
          <label class="block text-sm text-gray-300 mb-1.5">主打地区</label>
          <select id="formRegion" class="w-full px-3 py-2.5 rounded-lg text-sm">
            <option value="全球">全球</option>
            <option value="美国">美国</option>
            <option value="英国">英国</option>
            <option value="俄罗斯">俄罗斯</option>
            <option value="加拿大">加拿大</option>
          </select>
        </div>
        <div>
          <label class="block text-sm text-gray-300 mb-1.5">品牌Logo</label>
          <div class="flex items-center gap-3 mb-3">
            <div id="logoPreview" class="w-12 h-12 rounded-lg bg-white/10 flex items-center justify-center overflow-hidden flex-shrink-0">
              <svg class="w-6 h-6 text-gray-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"/>
              </svg>
            </div>
            <div class="flex-1">
              <!-- Toggle buttons -->
              <div class="flex mb-2 rounded-lg overflow-hidden border border-white/10">
                <button type="button" id="logoModeUrl" onclick="switchLogoMode('url')" class="flex-1 px-2 py-1.5 text-xs font-medium bg-blue-500/30 text-blue-300 border-r border-white/10">输入地址</button>
                <button type="button" id="logoModeUpload" onclick="switchLogoMode('upload')" class="flex-1 px-2 py-1.5 text-xs font-medium bg-white/5 text-gray-400 border-r border-white/10">本地上传</button>
                <button type="button" id="logoModeClipboard" onclick="switchLogoMode('clipboard')" class="flex-1 px-2 py-1.5 text-xs font-medium bg-white/5 text-gray-400">粘贴板</button>
              </div>
              <!-- URL input -->
              <div id="logoUrlArea">
                <input id="formLogoUrl" type="text" placeholder="https://example.com/logo.png" class="w-full px-3 py-2 rounded-lg text-sm bg-white/5 border border-white/10 text-white placeholder-gray-500 focus:outline-none focus:border-blue-500/50" />
              </div>
              <!-- File upload -->
              <div id="logoUploadArea" class="hidden">
                <label class="flex items-center justify-center px-3 py-2 rounded-lg text-sm bg-white/5 border border-dashed border-white/20 text-gray-400 cursor-pointer hover:border-blue-500/50 hover:text-blue-300 transition-colors">
                  <svg class="w-4 h-4 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12"/></svg>
                  选择图片文件
                  <input id="formLogo" type="file" accept="image/*" class="hidden" />
                </label>
              </div>
              <!-- Clipboard paste -->
              <div id="logoClipboardArea" class="hidden">
                <div id="clipboardPasteZone" tabindex="0" class="flex flex-col items-center justify-center px-3 py-3 rounded-lg text-sm bg-white/5 border-2 border-dashed border-white/20 text-gray-400 cursor-pointer hover:border-blue-500/50 hover:text-blue-300 transition-colors focus:border-blue-500/50 focus:text-blue-300">
                  <svg class="w-5 h-5 mb-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"/></svg>
                  <span class="text-xs">Ctrl+V 粘贴图片</span>
                  <span class="text-[10px] text-gray-500 mt-0.5">或点击此区域后粘贴</span>
                </div>
              </div>
            </div>
          </div>
          <input type="hidden" id="formLogoValue" value="" />
        </div>
        <button type="submit" id="formSubmitBtn" class="w-full py-2.5 bg-blue-500 hover:bg-blue-600 rounded-lg text-sm font-medium transition-colors">
          添加品牌
        </button>
      </form>
    </div>
  </div>

  <!-- Login Modal -->
  <div id="loginModal" class="fixed inset-0 modal-overlay z-[60] hidden items-center justify-center p-4">
    <div class="glass-card rounded-2xl p-6 w-full max-w-sm fade-in">
      <div class="flex items-center justify-center mb-6">
        <div class="w-14 h-14 rounded-full bg-blue-500/20 flex items-center justify-center">
          <svg class="w-7 h-7 text-blue-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/>
          </svg>
        </div>
      </div>
      <h2 class="text-xl font-semibold text-center mb-2">身份验证</h2>
      <p class="text-sm text-gray-400 text-center mb-6">请输入管理员账号和密码</p>
      <form id="loginForm" class="space-y-4">
        <div>
          <label class="block text-sm text-gray-300 mb-1.5">用户名</label>
          <input id="loginUsername" type="text" required autocomplete="off"
            class="w-full px-3 py-2.5 rounded-lg bg-white/10 border border-white/10 text-white text-sm focus:outline-none focus:border-blue-400 placeholder-gray-500"
            placeholder="请输入用户名" />
        </div>
        <div>
          <label class="block text-sm text-gray-300 mb-1.5">密码</label>
          <input id="loginPassword" type="password" required autocomplete="off"
            class="w-full px-3 py-2.5 rounded-lg bg-white/10 border border-white/10 text-white text-sm focus:outline-none focus:border-blue-400 placeholder-gray-500"
            placeholder="请输入密码" />
        </div>
        <p id="loginError" class="text-red-400 text-xs text-center hidden">用户名或密码错误</p>
        <button type="submit" class="w-full py-2.5 bg-blue-500 hover:bg-blue-600 rounded-lg text-sm font-medium transition-colors">
          确认登录
        </button>
      </form>
      <button id="loginCancel" class="w-full mt-3 py-2.5 rounded-lg bg-white/10 hover:bg-white/15 text-sm text-gray-300 transition-colors">
        取消
      </button>
    </div>
  </div>

  <!-- Delete Confirm Modal -->
  <div id="deleteModal" class="fixed inset-0 modal-overlay z-50 hidden items-center justify-center p-4">
    <div class="glass-card rounded-2xl p-6 w-full max-w-sm fade-in text-center">
      <div class="w-14 h-14 rounded-full bg-red-500/20 flex items-center justify-center mx-auto mb-4">
        <svg class="w-7 h-7 text-red-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/>
        </svg>
      </div>
      <h3 class="text-lg font-semibold mb-2">确认删除</h3>
      <p class="text-sm text-gray-400 mb-6" id="deleteBrandName">确定要删除此品牌吗？</p>
      <div class="flex gap-3">
        <button id="cancelDelete" class="flex-1 py-2.5 rounded-lg bg-white/10 hover:bg-white/15 text-sm transition-colors">取消</button>
        <button id="confirmDelete" class="flex-1 py-2.5 rounded-lg bg-red-500 hover:bg-red-600 text-sm font-medium transition-colors">删除</button>
      </div>
    </div>
  </div>

  <!-- Toast -->
  <div id="toast" class="fixed top-6 right-6 z-50 hidden">
    <div class="glass-card rounded-lg px-4 py-3 text-sm flex items-center gap-2 fade-in">
      <svg class="w-5 h-5 text-green-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/>
      </svg>
      <span id="toastMsg"></span>
    </div>
  </div>

  <script src="brands.js"></script>
  <script>
    // ========== State ==========
    let allBrands = [];
    let filteredBrands = [];
    let currentLetter = '';
    let currentRegion = '';
    let searchQuery = '';
    let debounceTimer = null;
    let logoBase64 = '';
    let isEditMode = false;
    let deleteTargetId = null;
    let isAuthenticated = false;
    let pendingAction = null; // 'add' or 'edit'

    const REGIONS = ['全球', '美国', '英国', '俄罗斯', '加拿大'];
    const LETTERS = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split('');

    // ========== Init ==========
    function init() {
      allBrands = [...BRANDS_DATA];

      // Load user-added brands from localStorage
      const userBrands = JSON.parse(localStorage.getItem('userBrands') || '[]');
      allBrands = [...allBrands, ...userBrands];

      // Load user-deleted ids from localStorage
      const deletedIds = JSON.parse(localStorage.getItem('deletedBrands') || '[]');
      allBrands = allBrands.filter(b => !deletedIds.includes(b.id));

      // Sort by name_en
      allBrands.sort((a, b) => a.name_en.localeCompare(b.name_en, 'en'));

      buildLetterFilter();
      buildRegionFilter();
      renderBrands();

      // Events
      document.getElementById('searchInput').addEventListener('input', onSearchInput);
      document.getElementById('addBtn').addEventListener('click', () => {
        if (!isAuthenticated) {
          pendingAction = 'add';
          openLoginModal();
        } else {
          openModal();
        }
      });
      document.getElementById('editBtn').addEventListener('click', () => {
        if (!isAuthenticated) {
          pendingAction = 'edit';
          openLoginModal();
        } else {
          toggleEditMode();
        }
      });
      document.getElementById('closeModal').addEventListener('click', closeModal);
      document.getElementById('brandModal').addEventListener('click', function(e) {
        if (e.target === this) closeModal();
      });
      document.getElementById('brandForm').addEventListener('submit', onFormSubmit);
      document.getElementById('formLogo').addEventListener('change', onLogoChange);
      document.getElementById('formLogoUrl').addEventListener('input', onLogoUrlInput);
      document.getElementById('cancelDelete').addEventListener('click', closeDeleteModal);
      document.getElementById('confirmDelete').addEventListener('click', onConfirmDelete);
      document.getElementById('deleteModal').addEventListener('click', function(e) {
        if (e.target === this) closeDeleteModal();
      });

      // Login modal events
      document.getElementById('loginForm').addEventListener('submit', onLoginSubmit);
      document.getElementById('loginCancel').addEventListener('click', closeLoginModal);
      document.getElementById('loginModal').addEventListener('click', function(e) {
        if (e.target === this) closeLoginModal();
      });

      // Export button
      document.getElementById('exportBtn').addEventListener('click', exportData);
    }

    // ========== Export Data ==========
    function exportData() {
      if (!isAuthenticated) {
        pendingAction = 'export';
        showLoginModal();
        return;
      }
      doExport();
    }

    function doExport() {
      try {
        const allBrands = getAllBrands();
        const exportObj = allBrands.map(b => ({
          id: b.id,
          name_en: b.name_en,
          name_cn: b.name_cn,
          url: b.url,
          region: b.region,
          level: b.level,
          logo: b.logo || ''
        }));
        const json = JSON.stringify(exportObj, null, 2);
        const blob = new Blob([json], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = 'brands_data.json';
        document.body.appendChild(a);
        a.click();
        setTimeout(() => {
          document.body.removeChild(a);
          URL.revokeObjectURL(url);
        }, 200);
        showToast('数据已导出，请将文件发给开发者更新到 brands.js');
      } catch (e) {
        showToast('导出失败：' + e.message);
      }
    }

    // ========== Edit Mode ==========
    function toggleEditMode() {
      isEditMode = !isEditMode;
      const btn = document.getElementById('editBtn');
      const text = document.getElementById('editBtnText');
      const banner = document.getElementById('editBanner');

      if (isEditMode) {
        btn.classList.remove('bg-white/10', 'hover:bg-white/15', 'border-white/10');
        btn.classList.add('bg-red-500/20', 'hover:bg-red-500/30', 'border-red-500/40');
        text.textContent = '退出编辑';
        banner.classList.remove('hidden');
      } else {
        btn.classList.add('bg-white/10', 'hover:bg-white/15', 'border-white/10');
        btn.classList.remove('bg-red-500/20', 'hover:bg-red-500/30', 'border-red-500/40');
        text.textContent = '编辑';
        banner.classList.add('hidden');
      }
      renderBrands();
    }

    // ========== Login ==========
    function openLoginModal() {
      const modal = document.getElementById('loginModal');
      modal.classList.remove('hidden');
      modal.classList.add('flex');
      document.getElementById('loginUsername').value = '';
      document.getElementById('loginPassword').value = '';
      document.getElementById('loginError').classList.add('hidden');
      document.getElementById('loginUsername').focus();
    }

    function closeLoginModal() {
      const modal = document.getElementById('loginModal');
      modal.classList.add('hidden');
      modal.classList.remove('flex');
      pendingAction = null;
    }

    function onLoginSubmit(e) {
      e.preventDefault();
      const username = document.getElementById('loginUsername').value.trim();
      const password = document.getElementById('loginPassword').value;

      if (username === 'admin' && password === 'funan') {
        isAuthenticated = true;
        closeLoginModal();
        showToast('登录成功');

        // Execute pending action
        if (pendingAction === 'add') {
          openModal();
        } else if (pendingAction === 'edit') {
          toggleEditMode();
        } else if (pendingAction === 'export') {
          doExport();
        }
        pendingAction = null;
      } else {
        document.getElementById('loginError').classList.remove('hidden');
      }
    }

    // ========== Filters ==========
    function buildLetterFilter() {
      const container = document.getElementById('letterFilter');
      LETTERS.forEach(letter => {
        const count = allBrands.filter(b => getFirstLetter(b.name_en) === letter).length;
        if (count > 0) {
          const btn = document.createElement('button');
          btn.className = 'filter-btn px-2.5 py-1 rounded-md text-xs text-gray-300';
          btn.dataset.letter = letter;
          btn.textContent = letter;
          btn.addEventListener('click', () => setLetter(letter));
          container.appendChild(btn);
        }
      });
      container.querySelector('[data-letter=""]').addEventListener('click', () => setLetter(''));
    }

    function buildRegionFilter() {
      const container = document.getElementById('regionFilter');
      REGIONS.forEach(region => {
        const btn = document.createElement('button');
        btn.className = 'filter-btn px-3 py-1.5 rounded-md text-xs text-gray-300';
        btn.dataset.region = region;
        btn.textContent = region;
        btn.addEventListener('click', () => setRegion(region));
        container.appendChild(btn);
      });
    }

    function getFirstLetter(name) {
      if (!name) return '#';
      const ch = name[0].toUpperCase();
      if (ch >= 'A' && ch <= 'Z') return ch;
      return '#';
    }

    function setLetter(letter) {
      currentLetter = letter;
      document.querySelectorAll('#letterFilter .filter-btn').forEach(btn => {
        btn.classList.toggle('active', btn.dataset.letter === letter);
      });
      renderBrands();
    }

    function setRegion(region) {
      currentRegion = currentRegion === region ? '' : region;
      document.querySelectorAll('#regionFilter .filter-btn').forEach(btn => {
        btn.classList.toggle('active', btn.dataset.region === currentRegion);
      });
      renderBrands();
    }

    // ========== Search ==========
    function onSearchInput(e) {
      clearTimeout(debounceTimer);
      debounceTimer = setTimeout(() => {
        searchQuery = e.target.value.trim().toLowerCase();
        renderBrands();
      }, 1000);
    }

    // ========== Render ==========
    function renderBrands() {
      let brands = [...allBrands];

      if (currentLetter) {
        brands = brands.filter(b => getFirstLetter(b.name_en) === currentLetter);
      }
      if (currentRegion) {
        brands = brands.filter(b => b.region === currentRegion);
      }
      if (searchQuery) {
        brands = brands.filter(b =>
          b.name_en.toLowerCase().includes(searchQuery) ||
          b.name_cn.toLowerCase().includes(searchQuery) ||
          b.url.toLowerCase().includes(searchQuery)
        );
      }

      filteredBrands = brands;
      document.getElementById('brandCount').textContent = `共 ${brands.length} 个品牌`;

      const container = document.getElementById('brandList');
      const emptyState = document.getElementById('emptyState');

      if (brands.length === 0) {
        container.innerHTML = '';
        emptyState.classList.remove('hidden');
        return;
      }

      emptyState.classList.add('hidden');

      // Group by letter
      const grouped = {};
      brands.forEach(b => {
        const letter = getFirstLetter(b.name_en);
        if (!grouped[letter]) grouped[letter] = [];
        grouped[letter].push(b);
      });

      let html = '';
      const sortedLetters = Object.keys(grouped).sort();

      sortedLetters.forEach(letter => {
        html += `<div class="col-span-full"><h2 class="text-lg font-semibold text-white mt-6 mb-3 letter-anchor" id="letter-${letter}">${letter}</h2></div>`;
        grouped[letter].forEach(brand => {
          html += renderCard(brand);
        });
      });

      container.innerHTML = html;
    }

    function renderCard(brand) {
      const logoHtml = brand.logo
        ? `<img src="${escapeHtml(brand.logo)}" alt="${escapeHtml(brand.name_en)}" class="brand-logo" onerror="this.style.display='none';this.nextElementSibling.style.display='flex'" /><div class="logo-fallback" style="display:none">${brand.name_en[0] || '?'}</div>`
        : `<div class="logo-fallback">${brand.name_en[0] || '?'}</div>`;

      const nameCnHtml = brand.name_cn
        ? `<span class="text-xs text-gray-400">${escapeHtml(brand.name_cn)}</span>`
        : '';

      const editClass = isEditMode ? ' editing' : '';
      const clickHandler = isEditMode ? '' : `onclick="window.open('${escapeHtml(brand.url)}', '_blank')"`;

      return `
        <div class="glass-card${editClass} rounded-xl p-4 transition-all duration-200 relative" ${clickHandler} data-brand-id="${brand.id}">
          <div class="flex items-start gap-3">
            ${logoHtml}
            <div class="flex-1 min-w-0">
              <div class="flex flex-col">
                <span class="text-sm font-semibold text-white truncate">${escapeHtml(brand.name_en)}</span>
                ${nameCnHtml}
              </div>
              <div class="text-xs text-gray-500 mt-1">主打地区：${escapeHtml(brand.region)}</div>
            </div>
          </div>
          <div class="mt-3 flex items-center gap-1.5 text-blue-400 text-xs hover:text-blue-300 transition-colors">
            <svg class="w-3.5 h-3.5 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14"/>
            </svg>
            <span class="truncate">${escapeHtml(brand.url)}</span>
          </div>
          ${isEditMode ? `
          <div class="edit-overlay">
            <button onclick="event.stopPropagation();openModal(${brand.id})" class="px-3 py-1.5 rounded-lg bg-blue-500 hover:bg-blue-600 text-xs font-medium transition-colors flex items-center gap-1">
              <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.232 5.232l3.536 3.536m-2.036-5.036a2.5 2.5 0 113.536 3.536L6.5 21.036H3v-3.572L16.732 3.732z"/></svg>
              编辑
            </button>
            <button onclick="event.stopPropagation();openDeleteModal(${brand.id},'${escapeHtml(brand.name_en)}')" class="px-3 py-1.5 rounded-lg bg-red-500 hover:bg-red-600 text-xs font-medium transition-colors flex items-center gap-1">
              <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/></svg>
              删除
            </button>
          </div>
          ` : ''}
        </div>
      `;
    }

    function escapeHtml(text) {
      if (!text) return '';
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    // ========== Modal ==========
    function openModal(editId) {
      const modal = document.getElementById('brandModal');
      const title = document.getElementById('modalTitle');
      const submitBtn = document.getElementById('formSubmitBtn');
      const formEditId = document.getElementById('formEditId');

      if (editId) {
        // Edit mode
        const brand = allBrands.find(b => b.id === editId);
        if (!brand) return;

        title.textContent = '编辑品牌';
        submitBtn.textContent = '保存修改';
        formEditId.value = editId;

        document.getElementById('formNameEn').value = brand.name_en;
        document.getElementById('formNameCn').value = brand.name_cn;
        document.getElementById('formUrl').value = brand.url;
        document.getElementById('formRegion').value = brand.region;

        if (brand.logo) {
          if (brand.logo.startsWith('data:')) {
            logoBase64 = brand.logo;
            document.getElementById('formLogoUrl').value = '';
            document.getElementById('formLogoValue').value = brand.logo;
            switchLogoMode('upload');
          } else {
            logoBase64 = '';
            document.getElementById('formLogoUrl').value = brand.logo;
            document.getElementById('formLogoValue').value = brand.logo;
            switchLogoMode('url');
          }
          document.getElementById('logoPreview').innerHTML = '<img src="' + escapeHtml(brand.logo) + '" class="w-12 h-12 rounded-lg object-contain" onerror="this.style.display=\'none\';this.nextElementSibling.style.display=\'flex\'" /><div class="logo-fallback" style="display:none">' + escapeHtml(brand.name_en[0] || '?') + '</div>';
        } else {
          logoBase64 = '';
          document.getElementById('formLogoUrl').value = '';
          document.getElementById('formLogoValue').value = '';
          switchLogoMode('url');
          resetLogoPreview();
        }
      } else {
        // Add mode
        title.textContent = '添加品牌';
        submitBtn.textContent = '添加品牌';
        formEditId.value = '';
        document.getElementById('brandForm').reset();
        logoBase64 = '';
        document.getElementById('formLogoUrl').value = '';
        document.getElementById('formLogoValue').value = '';
        switchLogoMode('url');
        resetLogoPreview();
        resetClipboardZone();
      }

      modal.classList.remove('hidden');
      modal.classList.add('flex');
      document.body.style.overflow = 'hidden';
    }

    function closeModal() {
      const modal = document.getElementById('brandModal');
      modal.classList.add('hidden');
      modal.classList.remove('flex');
      document.body.style.overflow = '';
      document.getElementById('brandForm').reset();
      logoBase64 = '';
      document.getElementById('formLogoUrl').value = '';
      document.getElementById('formLogoValue').value = '';
      resetLogoPreview();
      resetClipboardZone();
    }
    function resetLogoPreview() {
      document.getElementById('logoPreview').innerHTML = `
        <svg class="w-6 h-6 text-gray-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"/>
        </svg>
      `;
    }

    // ========== Logo Mode Toggle ==========
    function switchLogoMode(mode) {
      const urlBtn = document.getElementById('logoModeUrl');
      const uploadBtn = document.getElementById('logoModeUpload');
      const clipboardBtn = document.getElementById('logoModeClipboard');
      const urlArea = document.getElementById('logoUrlArea');
      const uploadArea = document.getElementById('logoUploadArea');
      const clipboardArea = document.getElementById('logoClipboardArea');

      const activeCls = 'flex-1 px-2 py-1.5 text-xs font-medium bg-blue-500/30 text-blue-300';
      const inactiveCls = 'flex-1 px-2 py-1.5 text-xs font-medium bg-white/5 text-gray-400';

      urlBtn.className = (mode === 'url' ? activeCls : inactiveCls) + ' border-r border-white/10';
      uploadBtn.className = (mode === 'upload' ? activeCls : inactiveCls) + ' border-r border-white/10';
      clipboardBtn.className = mode === 'clipboard' ? activeCls : inactiveCls;

      urlArea.classList.toggle('hidden', mode !== 'url');
      uploadArea.classList.toggle('hidden', mode !== 'upload');
      clipboardArea.classList.toggle('hidden', mode !== 'clipboard');

      if (mode === 'clipboard') {
        document.getElementById('clipboardPasteZone').focus();
      }
    }

    function onLogoChange(e) {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = function(ev) {
        logoBase64 = ev.target.result;
        document.getElementById('formLogoUrl').value = '';
        document.getElementById('formLogoValue').value = logoBase64;
        document.getElementById('logoPreview').innerHTML = '<img src="' + logoBase64 + '" class="w-12 h-12 rounded-lg object-contain" /><div class="logo-fallback" style="display:none">?</div>';
      };
      reader.readAsDataURL(file);
    }

    function onLogoUrlInput(e) {
      const url = e.target.value.trim();
      if (url) {
        logoBase64 = '';
        document.getElementById('formLogoValue').value = url;
        document.getElementById('logoPreview').innerHTML = '<img src="' + escapeHtml(url) + '" class="w-12 h-12 rounded-lg object-contain" onerror="this.style.display=\'none\';this.nextElementSibling.style.display=\'flex\'" /><div class="logo-fallback" style="display:none">?</div>';
      } else {
        document.getElementById('formLogoValue').value = '';
        resetLogoPreview();
      }
    }

    // Clipboard paste handler
    function handleClipboardPaste(e) {
      const items = e.clipboardData && e.clipboardData.items;
      if (!items) return;
      for (let i = 0; i < items.length; i++) {
        if (items[i].type.indexOf('image') !== -1) {
          e.preventDefault();
          const file = items[i].getAsFile();
          const reader = new FileReader();
          reader.onload = function(ev) {
            logoBase64 = ev.target.result;
            document.getElementById('formLogoUrl').value = '';
            document.getElementById('formLogoValue').value = logoBase64;
            document.getElementById('logoPreview').innerHTML = '<img src="' + logoBase64 + '" class="w-12 h-12 rounded-lg object-contain" /><div class="logo-fallback" style="display:none">?</div>';
            // Update clipboard zone visual
            const zone = document.getElementById('clipboardPasteZone');
            zone.innerHTML = '<svg class="w-5 h-5 mb-1 text-green-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/></svg><span class="text-xs text-green-400">图片已粘贴</span>';
          };
          reader.readAsDataURL(file);
          return;
        }
      }
    }

    // Attach paste event to clipboard zone and global
    document.getElementById('clipboardPasteZone').addEventListener('paste', handleClipboardPaste);
    document.addEventListener('paste', function(e) {
      // Only handle if clipboard mode is active and modal is open
      const clipboardArea = document.getElementById('logoClipboardArea');
      const modal = document.getElementById('brandModal');
      if (!clipboardArea.classList.contains('hidden') && !modal.classList.contains('hidden')) {
        handleClipboardPaste(e);
      }
    });

    function resetClipboardZone() {
      const zone = document.getElementById('clipboardPasteZone');
      if (zone) {
        zone.innerHTML = '<svg class="w-5 h-5 mb-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"/></svg><span class="text-xs">Ctrl+V 粘贴图片</span><span class="text-[10px] text-gray-500 mt-0.5">或点击此区域后粘贴</span>';
      }
    }

    // ========== Form Submit (Add or Edit) ==========
    function onFormSubmit(e) {
      e.preventDefault();

      const editId = document.getElementById('formEditId').value;
      const nameEn = document.getElementById('formNameEn').value.trim();
      const nameCn = document.getElementById('formNameCn').value.trim();
      const url = document.getElementById('formUrl').value.trim();
      const region = document.getElementById('formRegion').value;

      if (!nameEn || !url) return;

      if (editId) {
        // Edit existing brand
        const numId = Number(editId);
        const brandIndex = allBrands.findIndex(b => b.id === numId);
        if (brandIndex === -1) return;

        allBrands[brandIndex].name_en = nameEn;
        allBrands[brandIndex].name_cn = nameCn;
        allBrands[brandIndex].url = url;
        allBrands[brandIndex].region = region;
        if (logoBase64) {
          allBrands[brandIndex].logo = logoBase64;
        } else {
          const logoVal = document.getElementById('formLogoValue').value;
          if (logoVal) allBrands[brandIndex].logo = logoVal;
        }

        // Check if it's a user brand (stored in localStorage)
        const userBrands = JSON.parse(localStorage.getItem('userBrands') || '[]');
        const ubIndex = userBrands.findIndex(b => b.id === numId);
        if (ubIndex !== -1) {
          userBrands[ubIndex] = { ...allBrands[brandIndex] };
          localStorage.setItem('userBrands', JSON.stringify(userBrands));
        } else {
          // It's a built-in brand - save override to localStorage
          const overrides = JSON.parse(localStorage.getItem('brandOverrides') || '{}');
          overrides[numId] = { ...allBrands[brandIndex] };
          localStorage.setItem('brandOverrides', JSON.stringify(overrides));
        }

        // Re-sort
        allBrands.sort((a, b) => a.name_en.localeCompare(b.name_en, 'en'));
        closeModal();
        renderBrands();
        showToast('品牌修改成功！');
      } else {
        // Add new brand
        const newBrand = {
          id: Date.now(),
          name_en: nameEn,
          name_cn: nameCn,
          url: url,
          region: region,
          level: 3,
          logo: logoBase64 || document.getElementById('formLogoValue').value || ''
        };

        const userBrands = JSON.parse(localStorage.getItem('userBrands') || '[]');
        userBrands.push(newBrand);
        localStorage.setItem('userBrands', JSON.stringify(userBrands));

        allBrands.push(newBrand);
        allBrands.sort((a, b) => a.name_en.localeCompare(b.name_en, 'en'));

        closeModal();
        buildLetterFilter();
        renderBrands();
        showToast('品牌添加成功！');
      }
    }

    // ========== Delete ==========
    function openDeleteModal(id, name) {
      deleteTargetId = id;
      document.getElementById('deleteBrandName').textContent = `确定要删除「${name}」吗？此操作不可撤销。`;
      const modal = document.getElementById('deleteModal');
      modal.classList.remove('hidden');
      modal.classList.add('flex');
    }

    function closeDeleteModal() {
      const modal = document.getElementById('deleteModal');
      modal.classList.add('hidden');
      modal.classList.remove('flex');
      deleteTargetId = null;
    }

    function onConfirmDelete() {
      if (!deleteTargetId) return;

      // Remove from allBrands
      allBrands = allBrands.filter(b => b.id !== deleteTargetId);

      // Check if it's a user brand
      const userBrands = JSON.parse(localStorage.getItem('userBrands') || '[]');
      const ubIndex = userBrands.findIndex(b => b.id === deleteTargetId);
      if (ubIndex !== -1) {
        userBrands.splice(ubIndex, 1);
        localStorage.setItem('userBrands', JSON.stringify(userBrands));
      } else {
        // Built-in brand - add to deleted list
        const deletedIds = JSON.parse(localStorage.getItem('deletedBrands') || '[]');
        deletedIds.push(deleteTargetId);
        localStorage.setItem('deletedBrands', JSON.stringify(deletedIds));
      }

      closeDeleteModal();
      buildLetterFilter();
      renderBrands();
      showToast('品牌已删除');
    }

    // ========== Toast ==========
    function showToast(msg) {
      const toast = document.getElementById('toast');
      document.getElementById('toastMsg').textContent = msg;
      toast.classList.remove('hidden');
      setTimeout(() => toast.classList.add('hidden'), 2500);
    }

    // ========== Start ==========
    document.addEventListener('DOMContentLoaded', init);
  </script>
</body>
</html>
