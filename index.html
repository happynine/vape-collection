<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Vape品牌商官网查找系统</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { background: linear-gradient(135deg, #0f0f1a 0%, #1a1a2e 100%); min-height: 100vh; }
    .glass { background: rgba(255,255,255,0.06); backdrop-filter: blur(12px); border: 1px solid rgba(255,255,255,0.08); }
    .glass-card { background: rgba(255,255,255,0.06); backdrop-filter: blur(8px); border: 1px solid rgba(255,255,255,0.08); transition: transform 0.2s, box-shadow 0.2s; }
    .glass-card:hover { transform: translateY(-2px); border-color: rgba(255,255,255,0.18); background: rgba(255,255,255,0.1); }
    .logo-fallback { display:flex; align-items:center; justify-content:center; width:48px; height:48px; border-radius:8px; background:rgba(255,255,255,0.1); color:#888; font-size:18px; font-weight:700; flex-shrink:0; }
    .letter-active { background: rgba(255,255,255,0.9) !important; color: #0f0f1a !important; }
    .region-active { background: rgba(255,255,255,0.9) !important; color: #0f0f1a !important; }
    .tab-active { background: rgba(59,130,246,0.3) !important; color: #93c5fd !important; border-color: rgba(59,130,246,0.5) !important; }
    .edit-overlay { position:absolute; inset:0; background:rgba(0,0,0,0.5); border-radius:12px; display:flex; align-items:center; justify-content:center; gap:8px; opacity:0; transition:opacity 0.2s; }
    .glass-card:hover .edit-overlay { opacity:1; }
    .sub-brand-chip { display:inline-flex; align-items:center; gap:4px; padding:4px 10px; border-radius:8px; background:rgba(255,255,255,0.08); border:1px solid rgba(255,255,255,0.1); cursor:pointer; transition:background 0.2s; }
    .sub-brand-chip:hover { background:rgba(255,255,255,0.15); }
  </style>
</head>
<body class="text-white font-sans">
  <div class="max-w-6xl mx-auto px-4 py-8">
    <!-- Header -->
    <h1 class="text-3xl font-bold text-center mb-2">Vape品牌商官网查找系统</h1>
    <p class="text-center text-gray-400 text-sm mb-6">快速查找全球 Vape 品牌官方网站信息</p>

    <!-- Tab Navigation -->
    <div class="flex justify-center gap-2 mb-6">
      <button onclick="switchTab('official')" id="tabOfficial" class="tab-active px-6 py-2 rounded-full text-sm font-medium border border-white/10 transition-all">官网</button>
      <button onclick="switchTab('shop')" id="tabShop" class="px-6 py-2 rounded-full text-sm font-medium bg-white/5 text-gray-400 border border-white/10 transition-all">商城</button>
      <button onclick="switchTab('group')" id="tabGroup" class="px-6 py-2 rounded-full text-sm font-medium bg-white/5 text-gray-400 border border-white/10 transition-all">集团</button>
    </div>

    <!-- ==================== OFFICIAL TAB ==================== -->
    <div id="panelOfficial">
      <!-- Search -->
      <div class="relative max-w-2xl mx-auto mb-6">
        <svg class="absolute left-4 top-1/2 -translate-y-1/2 w-5 h-5 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
        <input id="searchInput" type="text" placeholder="搜索品牌名称、中文名或官网地址..." class="w-full pl-12 pr-4 py-3 rounded-full bg-white/10 backdrop-blur text-white placeholder-gray-400 border border-white/10 focus:outline-none focus:border-blue-400/50 text-sm" />
      </div>

      <!-- Letter Filter -->
      <div id="letterFilter" class="flex flex-wrap justify-center gap-1 mb-4"></div>

      <!-- Region Filter -->
      <div class="flex flex-wrap justify-center gap-2 mb-6">
        <button onclick="filterRegion('')" class="region-btn region-active px-3 py-1 rounded-full text-xs bg-white/10 text-gray-300 transition-all">全部</button>
        <button onclick="filterRegion('全球')" class="region-btn px-3 py-1 rounded-full text-xs bg-white/10 text-gray-300 transition-all">全球</button>
        <button onclick="filterRegion('美国')" class="region-btn px-3 py-1 rounded-full text-xs bg-white/10 text-gray-300 transition-all">美国</button>
        <button onclick="filterRegion('英国')" class="region-btn px-3 py-1 rounded-full text-xs bg-white/10 text-gray-300 transition-all">英国</button>
        <button onclick="filterRegion('俄罗斯')" class="region-btn px-3 py-1 rounded-full text-xs bg-white/10 text-gray-300 transition-all">俄罗斯</button>
        <button onclick="filterRegion('加拿大')" class="region-btn px-3 py-1 rounded-full text-xs bg-white/10 text-gray-300 transition-all">加拿大</button>
      </div>

      <!-- Brand Cards Grid -->
      <div id="brandGrid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4 mb-4"></div>
      <!-- Stats Bar for Official -->
      <div id="statsBarOfficial" class="text-xs text-gray-500 text-center py-3 border-t border-white/5 mb-16"></div>
    </div>

    <!-- ==================== SHOP TAB ==================== -->
    <div id="panelShop" class="hidden">
      <!-- Search -->
      <div class="relative max-w-2xl mx-auto mb-6">
        <svg class="absolute left-4 top-1/2 -translate-y-1/2 w-5 h-5 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
        <input id="shopSearchInput" type="text" placeholder="搜索商城名称、地区或网址..." class="w-full pl-12 pr-4 py-3 rounded-full bg-white/10 backdrop-blur text-white placeholder-gray-400 border border-white/10 focus:outline-none focus:border-blue-400/50 text-sm" />
      </div>

      <!-- Letter Filter for Shop -->
      <div id="shopLetterBar" class="flex flex-wrap justify-center gap-1 mb-4"></div>

      <!-- Region Filter for Shop -->
      <div class="flex flex-wrap justify-center gap-2 mb-6">
        <button onclick="filterShopRegion('')" class="shop-region-btn region-active px-3 py-1 rounded-full text-xs bg-white/10 text-gray-300 transition-all">全部</button>
        <button onclick="filterShopRegion('中国')" class="shop-region-btn px-3 py-1 rounded-full text-xs bg-white/10 text-gray-300 transition-all">中国</button>
        <button onclick="filterShopRegion('美国')" class="shop-region-btn px-3 py-1 rounded-full text-xs bg-white/10 text-gray-300 transition-all">美国</button>
        <button onclick="filterShopRegion('英国')" class="shop-region-btn px-3 py-1 rounded-full text-xs bg-white/10 text-gray-300 transition-all">英国</button>
        <button onclick="filterShopRegion('俄罗斯')" class="shop-region-btn px-3 py-1 rounded-full text-xs bg-white/10 text-gray-300 transition-all">俄罗斯</button>
        <button onclick="filterShopRegion('加拿大')" class="shop-region-btn px-3 py-1 rounded-full text-xs bg-white/10 text-gray-300 transition-all">加拿大</button>
        <button onclick="filterShopRegion('欧洲')" class="shop-region-btn px-3 py-1 rounded-full text-xs bg-white/10 text-gray-300 transition-all">欧洲</button>
        <button onclick="filterShopRegion('东南亚')" class="shop-region-btn px-3 py-1 rounded-full text-xs bg-white/10 text-gray-300 transition-all">东南亚</button>
        <button onclick="filterShopRegion('中东')" class="shop-region-btn px-3 py-1 rounded-full text-xs bg-white/10 text-gray-300 transition-all">中东</button>
      </div>

      <!-- Shop Cards Grid -->
      <div id="shopGrid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4 mb-4"></div>
      <!-- Stats Bar for Shop -->
      <div id="statsBarShop" class="text-xs text-gray-500 text-center py-3 border-t border-white/5 mb-16"></div>
    </div>

    <!-- ==================== GROUP TAB ==================== -->
    <div id="panelGroup" class="hidden">
      <!-- Search -->
      <div class="relative max-w-2xl mx-auto mb-6">
        <svg class="absolute left-4 top-1/2 -translate-y-1/2 w-5 h-5 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
        <input id="groupSearchInput" type="text" placeholder="搜索集团名称或介绍..." class="w-full pl-12 pr-4 py-3 rounded-full bg-white/10 backdrop-blur text-white placeholder-gray-400 border border-white/10 focus:outline-none focus:border-blue-400/50 text-sm" />
      </div>

      <!-- Group Cards -->
      <div id="groupGrid" class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-4"></div>
      <!-- Stats Bar for Group -->
      <div id="statsBarGroup" class="text-xs text-gray-500 text-center py-3 border-t border-white/5 mb-16"></div>
    </div>
  </div>

  <!-- ==================== FIXED BOTTOM BAR ==================== -->
  <div id="fixedBottomBar" class="fixed bottom-4 left-4 z-40 flex flex-col gap-1.5">
    <button id="btnAdd" onclick="handleAdd()" class="px-3 py-1.5 rounded-lg bg-blue-500 text-white text-xs font-medium hover:bg-blue-600 transition shadow-lg">添加</button>
    <button id="btnEdit" onclick="handleEdit()" class="px-3 py-1.5 rounded-lg bg-white/10 text-gray-300 text-xs font-medium hover:bg-white/20 transition backdrop-blur shadow-lg">编辑</button>
    <button id="btnExport" onclick="handleExport()" class="px-3 py-1.5 rounded-lg bg-green-500 text-white text-xs font-medium hover:bg-green-600 transition shadow-lg">导出数据</button>
  </div>
  <!-- Edit Mode Bar (Fixed) -->
  <div id="fixedEditBar" class="hidden fixed bottom-4 left-4 z-40 py-1.5 px-3 flex flex-col gap-1.5 bg-red-500/80 backdrop-blur rounded-lg shadow-lg">
    <span class="text-white text-xs flex items-center">编辑模式已开启</span>
    <button onclick="exitCurrentEditMode()" class="px-3 py-1.5 rounded-lg bg-red-600 text-white text-xs font-medium hover:bg-red-700 transition">退出编辑</button>
  </div>

  <!-- Right Side A-Z Filter (Fixed) - Shows when scrolled -->
  <div id="rightSideAZ" class="hidden fixed right-4 top-1/2 -translate-y-1/2 z-40 flex flex-col gap-0.5 bg-white/5 backdrop-blur rounded-lg py-2 px-1 shadow-lg">
    <!-- A-Z letters will be generated by JS -->
  </div>

  <!-- Back to Top Button -->
  <button id="backToTop" onclick="scrollToTop()" class="hidden fixed bottom-4 right-4 z-40 w-10 h-10 rounded-full bg-white/10 backdrop-blur text-gray-300 text-sm font-medium hover:bg-white/20 transition shadow-lg flex items-center justify-center" title="回到顶部">
    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 15l7-7 7 7"/></svg>
  </button>

  <!-- ==================== LOGIN MODAL ==================== -->
  <div id="loginModal" class="hidden fixed inset-0 bg-black/60 flex items-center justify-center z-50">
    <div class="glass rounded-2xl p-6 w-full max-w-sm mx-4">
      <h3 class="text-lg font-bold mb-4 text-center">身份验证</h3>
      <div class="space-y-3">
        <input id="loginUser" type="text" placeholder="用户名" class="w-full px-4 py-2.5 rounded-lg bg-white/10 text-white placeholder-gray-400 border border-white/10 focus:outline-none focus:border-blue-400/50 text-sm" />
        <input id="loginPass" type="password" placeholder="密码" class="w-full px-4 py-2.5 rounded-lg bg-white/10 text-white placeholder-gray-400 border border-white/10 focus:outline-none focus:border-blue-400/50 text-sm" />
        <p id="loginError" class="text-red-400 text-xs hidden">用户名或密码错误</p>
        <div class="flex gap-3">
          <button onclick="closeLoginModal()" class="flex-1 py-2.5 rounded-lg bg-white/10 text-gray-300 text-sm">取消</button>
          <button onclick="onLoginSubmit()" class="flex-1 py-2.5 rounded-lg bg-blue-500 text-white text-sm">确认</button>
        </div>
      </div>
    </div>
  </div>

  <!-- ==================== BRAND MODAL (Official & Shop) ==================== -->
  <div id="brandModal" class="hidden fixed inset-0 bg-black/60 flex items-center justify-center z-50">
    <div class="glass rounded-2xl p-6 w-full max-w-md mx-4 max-h-[90vh] overflow-y-auto">
      <h3 id="modalTitle" class="text-lg font-bold mb-4">添加品牌</h3>
      <form id="brandForm" class="space-y-4">
        <input type="hidden" id="formEditId" />
        <input type="hidden" id="formLogoValue" />
        <input type="hidden" id="formType" value="official" />
        <div>
          <label class="block text-xs text-gray-400 mb-1">英文名 *</label>
          <input id="formNameEn" type="text" required class="w-full px-3 py-2 rounded-lg bg-white/10 text-white border border-white/10 focus:outline-none focus:border-blue-400/50 text-sm" />
        </div>
        <div>
          <label class="block text-xs text-gray-400 mb-1">中文名</label>
          <input id="formNameCn" type="text" class="w-full px-3 py-2 rounded-lg bg-white/10 text-white border border-white/10 focus:outline-none focus:border-blue-400/50 text-sm" />
        </div>
        <div>
          <label id="formUrlLabel" class="block text-xs text-gray-400 mb-1">官网地址 *</label>
          <input id="formUrl" type="url" required class="w-full px-3 py-2 rounded-lg bg-white/10 text-white border border-white/10 focus:outline-none focus:border-blue-400/50 text-sm" />
        </div>
        <div>
          <label class="block text-xs text-gray-400 mb-1">主打地区</label>
          <select id="formRegion" class="w-full px-3 py-2 rounded-lg bg-white/10 text-white border border-white/10 focus:outline-none focus:border-blue-400/50 text-sm">
            <option value="全球" class="bg-gray-800">全球</option>
            <option value="中国" class="bg-gray-800">中国</option>
            <option value="美国" class="bg-gray-800">美国</option>
            <option value="英国" class="bg-gray-800">英国</option>
            <option value="俄罗斯" class="bg-gray-800">俄罗斯</option>
            <option value="加拿大" class="bg-gray-800">加拿大</option>
            <option value="欧洲" class="bg-gray-800">欧洲</option>
            <option value="东南亚" class="bg-gray-800">东南亚</option>
            <option value="中东" class="bg-gray-800">中东</option>
          </select>
        </div>
        <!-- Shop-specific: country/region detail -->
        <div id="formCountryWrap" class="hidden">
          <label class="block text-xs text-gray-400 mb-1">国家/地区详情</label>
          <input id="formCountry" type="text" placeholder="如：中国深圳、美国加州" class="w-full px-3 py-2 rounded-lg bg-white/10 text-white border border-white/10 focus:outline-none focus:border-blue-400/50 text-sm" />
        </div>
        <!-- Logo -->
        <div>
          <label class="block text-xs text-gray-400 mb-1">品牌Logo</label>
          <div class="flex items-center gap-3 mb-2">
            <div id="logoPreview" class="logo-fallback">?</div>
            <div class="flex-1">
              <div class="flex rounded-lg overflow-hidden border border-white/10 mb-2">
                <button type="button" onclick="switchLogoMode('url')" id="logoModeUrl" class="flex-1 px-2 py-1.5 text-xs font-medium bg-blue-500/30 text-blue-300 border-r border-white/10">输入地址</button>
                <button type="button" onclick="switchLogoMode('upload')" id="logoModeUpload" class="flex-1 px-2 py-1.5 text-xs font-medium bg-white/5 text-gray-400 border-r border-white/10">本地上传</button>
                <button type="button" onclick="switchLogoMode('clipboard')" id="logoModeClipboard" class="flex-1 px-2 py-1.5 text-xs font-medium bg-white/5 text-gray-400">粘贴板</button>
              </div>
              <div id="logoUrlArea">
                <input id="formLogoUrl" type="text" placeholder="输入Logo图片地址" oninput="onLogoUrlInput(event)" class="w-full px-3 py-2 rounded-lg bg-white/10 text-white border border-white/10 focus:outline-none focus:border-blue-400/50 text-sm" />
              </div>
              <div id="logoUploadArea" class="hidden">
                <input type="file" accept="image/*" onchange="onLogoChange(event)" class="w-full text-sm text-gray-400" />
              </div>
              <div id="logoClipboardArea" class="hidden">
                <div id="clipboardPasteZone" tabindex="0" class="w-full px-3 py-3 rounded-lg bg-white/5 border border-dashed border-white/20 text-center cursor-pointer flex flex-col items-center">
                  <svg class="w-5 h-5 mb-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"/></svg>
                  <span class="text-xs">Ctrl+V 粘贴图片</span>
                  <span class="text-[10px] text-gray-500 mt-0.5">或点击此区域后粘贴</span>
                </div>
              </div>
            </div>
          </div>
        </div>
        <div class="flex gap-3">
          <button type="button" onclick="closeModal()" class="flex-1 py-2.5 rounded-lg bg-white/10 text-gray-300 text-sm">取消</button>
          <button type="submit" class="flex-1 py-2.5 rounded-lg bg-blue-500 text-white text-sm">保存</button>
        </div>
      </form>
    </div>
  </div>

  <!-- ==================== GROUP MODAL ==================== -->
  <div id="groupModal" class="hidden fixed inset-0 bg-black/60 flex items-center justify-center z-50">
    <div class="glass rounded-2xl p-6 w-full max-w-lg mx-4 max-h-[90vh] overflow-y-auto">
      <h3 id="groupModalTitle" class="text-lg font-bold mb-4">添加集团</h3>
      <form id="groupForm" class="space-y-4">
        <input type="hidden" id="groupEditId" />
        <div>
          <label class="block text-xs text-gray-400 mb-1">集团名称 *</label>
          <input id="groupName" type="text" required class="w-full px-3 py-2 rounded-lg bg-white/10 text-white border border-white/10 focus:outline-none focus:border-blue-400/50 text-sm" />
        </div>
        <div>
          <label class="block text-xs text-gray-400 mb-1">集团介绍</label>
          <textarea id="groupDesc" rows="3" placeholder="简要介绍集团背景" class="w-full px-3 py-2 rounded-lg bg-white/10 text-white border border-white/10 focus:outline-none focus:border-blue-400/50 text-sm resize-none"></textarea>
        </div>
        <div>
          <label class="block text-xs text-gray-400 mb-1">集团网址</label>
          <input id="groupUrl" type="url" placeholder="https://..." class="w-full px-3 py-2 rounded-lg bg-white/10 text-white border border-white/10 focus:outline-none focus:border-blue-400/50 text-sm" />
        </div>
        <div>
          <label class="block text-xs text-gray-400 mb-1">集团Logo</label>
          <input id="groupLogo" type="text" placeholder="Logo图片地址" class="w-full px-3 py-2 rounded-lg bg-white/10 text-white border border-white/10 focus:outline-none focus:border-blue-400/50 text-sm" />
        </div>
        <div>
          <label class="block text-xs text-gray-400 mb-1">旗下子品牌（从已有品牌中关联）</label>
          <div class="relative">
            <input id="groupSubSearch" type="text" placeholder="搜索品牌名关联..." oninput="searchSubBrands()" class="w-full px-3 py-2 rounded-lg bg-white/10 text-white border border-white/10 focus:outline-none focus:border-blue-400/50 text-sm" />
            <div id="subBrandResults" class="hidden absolute top-full left-0 right-0 mt-1 glass rounded-lg max-h-40 overflow-y-auto z-10"></div>
          </div>
          <div id="selectedSubBrands" class="flex flex-wrap gap-2 mt-2"></div>
        </div>
        <div>
          <label class="block text-xs text-gray-400 mb-1">手动添加子品牌</label>
          <div class="flex gap-2">
            <input id="manualSubName" type="text" placeholder="子品牌名" class="flex-1 px-3 py-2 rounded-lg bg-white/10 text-white border border-white/10 focus:outline-none focus:border-blue-400/50 text-sm" />
            <input id="manualSubUrl" type="text" placeholder="网址" class="flex-1 px-3 py-2 rounded-lg bg-white/10 text-white border border-white/10 focus:outline-none focus:border-blue-400/50 text-sm" />
            <button type="button" onclick="addManualSubBrand()" class="px-3 py-2 rounded-lg bg-blue-500/30 text-blue-300 text-sm">添加</button>
          </div>
        </div>
        <div class="flex gap-3">
          <button type="button" onclick="closeGroupModal()" class="flex-1 py-2.5 rounded-lg bg-white/10 text-gray-300 text-sm">取消</button>
          <button type="submit" class="flex-1 py-2.5 rounded-lg bg-blue-500 text-white text-sm">保存</button>
        </div>
      </form>
    </div>
  </div>

  <!-- ==================== DELETE MODAL ==================== -->
  <div id="deleteModal" class="hidden fixed inset-0 bg-black/60 flex items-center justify-center z-50">
    <div class="glass rounded-2xl p-6 w-full max-w-sm mx-4">
      <h3 class="text-lg font-bold mb-4 text-center">确认删除</h3>
      <p id="deleteBrandName" class="text-sm text-gray-300 mb-6 text-center"></p>
      <div class="flex gap-3">
        <button onclick="closeDeleteModal()" class="flex-1 py-2.5 rounded-lg bg-white/10 text-gray-300 text-sm">取消</button>
        <button onclick="onConfirmDelete()" class="flex-1 py-2.5 rounded-lg bg-red-500 text-white text-sm">删除</button>
      </div>
    </div>
  </div>

  <!-- Toast -->
  <div id="toast" class="hidden fixed top-6 left-1/2 -translate-x-1/2 glass px-6 py-3 rounded-full text-sm z-50"></div>

  <script src="brands.js"></script>
  <script>
    // ========== State ==========
    let allBrands = [];
    let currentTab = 'official';
    let selectedLetter = '';
    let selectedRegion = '';
    let editMode = false;
    let shopEditMode = false;
    let groupEditMode = false;
    let isAuthenticated = false;
    let pendingAction = null;
    let deleteTargetId = null;
    let deleteTargetType = '';
    let logoBase64 = '';
    let searchTimeout = null;

    // Shop data
    let shopBrands = [];
    let selectedShopRegion = '';
    let selectedShopLetter = '';
    let shopSearchTimeout = null;

    // Group data
    let groupData = [];
    let groupSearchTimeout = null;
    let currentSubBrands = []; // temp for group modal

    // ========== Tab Switch ==========
    function switchTab(tab) {
      currentTab = tab;
      document.getElementById('panelOfficial').classList.toggle('hidden', tab !== 'official');
      document.getElementById('panelShop').classList.toggle('hidden', tab !== 'shop');
      document.getElementById('panelGroup').classList.toggle('hidden', tab !== 'group');
      document.getElementById('tabOfficial').className = (tab === 'official' ? 'tab-active ' : '') + 'px-6 py-2 rounded-full text-sm font-medium border border-white/10 transition-all' + (tab !== 'official' ? ' bg-white/5 text-gray-400' : '');
      document.getElementById('tabShop').className = (tab === 'shop' ? 'tab-active ' : '') + 'px-6 py-2 rounded-full text-sm font-medium border border-white/10 transition-all' + (tab !== 'shop' ? ' bg-white/5 text-gray-400' : '');
      document.getElementById('tabGroup').className = (tab === 'group' ? 'tab-active ' : '') + 'px-6 py-2 rounded-full text-sm font-medium border border-white/10 transition-all' + (tab !== 'group' ? ' bg-white/5 text-gray-400' : '');
      // Reset edit mode when switching tabs
      if (editMode) exitEditMode();
      if (shopEditMode) exitShopEditMode();
      if (groupEditMode) exitGroupEditMode();
      // Hide right side A-Z when not on official or shop tab
      const rightAZ = document.getElementById('rightSideAZ');
      const shopAZ = document.getElementById('shopRightAZ');
      if (tab !== 'official' && tab !== 'shop') {
        if (rightAZ) rightAZ.classList.add('hidden');
        if (shopAZ) shopAZ.classList.add('hidden');
      } else if (tab === 'official') {
        if (shopAZ) shopAZ.classList.add('hidden');
        handleScroll();
      } else if (tab === 'shop') {
        if (rightAZ) rightAZ.classList.add('hidden');
        handleScroll();
      }
      updateStatsBar();
    }

    function handleAdd() {

    function updateFixedBar() {
      const isEditing = editMode || shopEditMode || groupEditMode;
      document.getElementById('fixedBottomBar').classList.toggle('hidden', isEditing);
      document.getElementById('fixedEditBar').classList.toggle('hidden', !isEditing);

    function getAllBrands() { return allBrands || []; }
    function getAllShops() { return JSON.parse(localStorage.getItem('shopBrands') || '[]'); }
    function getAllGroups() { return JSON.parse(localStorage.getItem('groupData') || '[]'); }
    function updateStatsBar() {
      if (currentTab === 'official') {
        const el = document.getElementById('statsBarOfficial');
        if (!el) return;
        const brands = getAllBrands();
        const regions = {};
        brands.forEach(b => { if (b.region) regions[b.region] = (regions[b.region]||0)+1; });
        let html = `总计: ${brands.length}`;
        const sorted = Object.entries(regions).sort((a,b)=>b[1]-a[1]);
        sorted.forEach(([r,c]) => { html += ` | ${r}: ${c}`; });
        el.textContent = html;
      } else if (currentTab === 'shop') {
        const el = document.getElementById('statsBarShop');
        if (!el) return;
        const shops = getAllShops();
        const regions = {};
        shops.forEach(s => { const r = s.region || s.country || '未分类'; regions[r] = (regions[r]||0)+1; });
        let html = `总计: ${shops.length}`;
        const sorted = Object.entries(regions).sort((a,b)=>b[1]-a[1]);
        sorted.forEach(([r,c]) => { html += ` | ${r}: ${c}`; });
        el.textContent = html;
      } else if (currentTab === 'group') {
        const el = document.getElementById('statsBarGroup');
        if (!el) return;
        const groups = getAllGroups();
        let html = `总计: ${groups.length}`;
        const totalSubs = groups.reduce((s,g) => s + (g.sub_brands||[]).length, 0);
        html += ` | 子品牌: ${totalSubs}`;
        el.textContent = html;
      }
    }

    // ========== Right Side A-Z Filter ==========
    function buildRightSideAZ() {
      const container = document.getElementById('rightSideAZ');
      let html = '<button onclick="quickJumpLetter(\'\')" class="px-1.5 py-0.5 text-[10px] text-gray-400 hover:text-white hover:bg-white/10 rounded transition">全</button>';
      'ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split('').forEach(l => {
        html += `<button onclick="quickJumpLetter('${l}')" class="px-1.5 py-0.5 text-[10px] text-gray-400 hover:text-white hover:bg-white/10 rounded transition">${l}</button>`;
      });
      container.innerHTML = html;
    }

    function quickJumpLetter(letter) {
      if (currentTab !== 'official') return;
      filterLetter(letter);
      // Scroll to the letter section if exists
      if (letter) {
        const headings = document.querySelectorAll('#brandGrid h2');
        for (const h of headings) {
          if (h.textContent === letter) {
            h.scrollIntoView({ behavior: 'smooth', block: 'start' });
            break;
          }
        }
      } else {
        window.scrollTo({ top: 0, behavior: 'smooth' });
      }
    }

    // ========== Scroll Handler ==========
    function handleScroll() {
      const scrollY = window.scrollY;
      const windowHeight = window.innerHeight;
      const showThreshold = windowHeight;

      // Show right side A-Z on official or shop tab when scrolled
      const rightAZ = document.getElementById('rightSideAZ');
      const shopAZ = document.getElementById('shopRightAZ');
      if (rightAZ) {
        if (currentTab === 'official' && scrollY > showThreshold) {
          rightAZ.classList.remove('hidden');
        } else {
          rightAZ.classList.add('hidden');
        }
      }
      if (shopAZ) {
        if (currentTab === 'shop' && scrollY > showThreshold) {
          shopAZ.classList.remove('hidden');
        } else {
          shopAZ.classList.add('hidden');
        }
      }

      // Show back to top button when scrolled more than one page
      const backToTop = document.getElementById('backToTop');
      if (scrollY > showThreshold) {
        backToTop.classList.remove('hidden');
      } else {
        backToTop.classList.add('hidden');
      }
    }

    function scrollToTop() {
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    // ========== OFFICIAL: Letter Filter ==========
    function buildLetterFilter() {
      const letters = new Set();
      allBrands.forEach(b => { if (b.name_en) letters.add(b.name_en[0].toUpperCase()); });
      const sorted = [...letters].sort();
      const container = document.getElementById('letterFilter');
      let html = '<button onclick="filterLetter(\'\')" class="letter-btn px-2.5 py-1 rounded text-xs bg-white/8 text-gray-300 hover:bg-white/20 transition ' + (!selectedLetter ? 'letter-active' : '') + '">全部</button>';
      'ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split('').forEach(l => {
        const exists = sorted.includes(l);
        html += `<button onclick="filterLetter('${l}')" class="letter-btn px-2.5 py-1 rounded text-xs transition ${exists ? 'bg-white/8 text-gray-300 hover:bg-white/20' : 'bg-white/3 text-gray-600 cursor-not-allowed'} ${selectedLetter === l ? 'letter-active' : ''}" ${!exists ? 'disabled' : ''}>${l}</button>`;
      });
      container.innerHTML = html;
    }

    function filterLetter(l) {
      selectedLetter = l;
      buildLetterFilter();
      renderBrands();
    }

    function filterShopLetter(l) {
      selectedShopLetter = l;
      renderShopBrands();
    }

    function filterRegion(r) {
      selectedRegion = r;
      document.querySelectorAll('.region-btn').forEach(b => b.classList.remove('region-active'));
      event.target.classList.add('region-active');
      renderBrands();
    }

    function escapeHtml(s) { const d = document.createElement('div'); d.textContent = s; return d.innerHTML; }

    function renderBrands() {
      const query = document.getElementById('searchInput').value.trim().toLowerCase();
      let filtered = allBrands;
      if (query) filtered = filtered.filter(b => b.name_en.toLowerCase().includes(query) || (b.name_cn && b.name_cn.toLowerCase().includes(query)) || b.url.toLowerCase().includes(query));
      if (selectedLetter) filtered = filtered.filter(b => b.name_en[0].toUpperCase() === selectedLetter);
      if (selectedRegion) filtered = filtered.filter(b => b.region === selectedRegion);

      const grid = document.getElementById('brandGrid');
      if (!filtered.length) { grid.innerHTML = '<p class="text-gray-500 text-center col-span-full py-12">没有找到匹配的品牌</p>'; return; }

      // Group by letter
      const groups = {};
      filtered.forEach(b => { const l = b.name_en[0].toUpperCase(); if (!groups[l]) groups[l] = []; groups[l].push(b); });

      let html = '';
      Object.keys(groups).sort().forEach(letter => {
        html += `<div class="col-span-full"><h2 class="text-xl font-bold text-white/80 mb-3 mt-2 border-b border-white/10 pb-2">${letter}</h2></div>`;

          html += `<div class="glass-card rounded-xl p-4 relative cursor-pointer" onclick="${editMode ? '' : `window.open('${escapeHtml(b.url)}','_blank')`}">

            <div class="flex items-start gap-3">

      if (selectedShopRegion) filtered = filtered.filter(b => b.region === selectedShopRegion);
      if (selectedShopLetter) filtered = filtered.filter(b => b.name_en[0].toUpperCase() === selectedShopLetter);
      filtered.sort((a, b) => a.name_en.localeCompare(b.name_en, 'en', { sensitivity: 'base' }));

    // ========== Auth ==========
    function requireAuth(action) {
      if (isAuthenticated) {
        executeAction(action);
        return;
      }
      pendingAction = action;
      document.getElementById('loginModal').classList.remove('hidden');
      document.getElementById('loginModal').classList.add('flex');
      document.getElementById('loginUser').value = '';
      document.getElementById('loginPass').value = '';
      document.getElementById('loginError').classList.add('hidden');
      document.getElementById('loginUser').focus();
    }

    function openLoginModal() {
      document.getElementById('loginModal').classList.remove('hidden');
      document.getElementById('loginModal').classList.add('flex');
    }

    function closeLoginModal() {
      document.getElementById('loginModal').classList.add('hidden');
      document.getElementById('loginModal').classList.remove('flex');
    }

    function onLoginSubmit() {
      const user = document.getElementById('loginUser').value.trim();
      const pass = document.getElementById('loginPass').value.trim();
      if (user === 'admin' && pass === 'funan') {
        isAuthenticated = true;
        const action = pendingAction;
        closeLoginModal();
        pendingAction = null;
        if (action) executeAction(action);
      } else {
        document.getElementById('loginError').classList.remove('hidden');
      }
    }

    function executeAction(action) {
      switch(action) {
        case 'add': openAddModal(); break;
        case 'edit': toggleEditMode(); break;
        case 'export': doExport(); break;
        case 'shop-add': openShopAddModal(); break;
        case 'shop-edit': toggleShopEditMode(); break;
        case 'shop-export': doShopExport(); break;
        case 'group-add': openGroupAddModal(); break;
        case 'group-edit': toggleGroupEditMode(); break;
        case 'group-export': doGroupExport(); break;
      }
    }

    // ========== Edit Mode (Official) ==========
    function toggleEditMode() {
      editMode = !editMode;
      updateFixedBar();
      renderBrands();
    }
    function exitEditMode() {
      editMode = false;
      updateFixedBar();
      renderBrands();
    }

    // ========== Edit Mode (Shop) ==========
    function toggleShopEditMode() {
      shopEditMode = !shopEditMode;
      updateFixedBar();
      renderShopBrands();
    }
    function exitShopEditMode() {
      shopEditMode = false;
      updateFixedBar();
      renderShopBrands();
    }

    // ========== Edit Mode (Group) ==========
    function toggleGroupEditMode() {
      groupEditMode = !groupEditMode;
      updateFixedBar();
      renderGroups();
    }
    function exitGroupEditMode() {
      groupEditMode = false;
      updateFixedBar();
      renderGroups();
    }

    // ========== Logo helpers ==========
    function switchLogoMode(mode) {
      const urlBtn = document.getElementById('logoModeUrl'), uploadBtn = document.getElementById('logoModeUpload'), clipboardBtn = document.getElementById('logoModeClipboard');
      const urlArea = document.getElementById('logoUrlArea'), uploadArea = document.getElementById('logoUploadArea'), clipboardArea = document.getElementById('logoClipboardArea');
      const activeCls = 'flex-1 px-2 py-1.5 text-xs font-medium bg-blue-500/30 text-blue-300';
      const inactiveCls = 'flex-1 px-2 py-1.5 text-xs font-medium bg-white/5 text-gray-400';
      urlBtn.className = (mode === 'url' ? activeCls : inactiveCls) + ' border-r border-white/10';
      uploadBtn.className = (mode === 'upload' ? activeCls : inactiveCls) + ' border-r border-white/10';
      clipboardBtn.className = mode === 'clipboard' ? activeCls : inactiveCls;
      urlArea.classList.toggle('hidden', mode !== 'url');
      uploadArea.classList.toggle('hidden', mode !== 'upload');
      clipboardArea.classList.toggle('hidden', mode !== 'clipboard');
      if (mode === 'clipboard') document.getElementById('clipboardPasteZone').focus();
    }

    function onLogoChange(e) {
      const file = e.target.files[0]; if (!file) return;
      const reader = new FileReader();
      reader.onload = function(ev) {
        logoBase64 = ev.target.result;
        document.getElementById('formLogoUrl').value = '';
        document.getElementById('formLogoValue').value = logoBase64;
        document.getElementById('logoPreview').outerHTML = '<div id="logoPreview"><img src="' + logoBase64 + '" class="w-12 h-12 rounded-lg object-contain" /></div>';
      };
      reader.readAsDataURL(file);
    }

    function onLogoUrlInput(e) {
      const url = e.target.value.trim();
      if (url) {
        logoBase64 = '';
        document.getElementById('formLogoValue').value = url;
        document.getElementById('logoPreview').outerHTML = '<div id="logoPreview"><img src="' + escapeHtml(url) + '" class="w-12 h-12 rounded-lg object-contain" onerror="this.style.display=\'none\'" /></div>';
      } else {
        document.getElementById('formLogoValue').value = '';
        document.getElementById('logoPreview').outerHTML = '<div id="logoPreview" class="logo-fallback">?</div>';
      }
    }

    function handleClipboardPaste(e) {
      const items = e.clipboardData && e.clipboardData.items; if (!items) return;
      for (let i = 0; i < items.length; i++) {
        if (items[i].type.indexOf('image') !== -1) {
          e.preventDefault();
          const file = items[i].getAsFile();
          const reader = new FileReader();
          reader.onload = function(ev) {
            logoBase64 = ev.target.result;
            document.getElementById('formLogoUrl').value = '';
            document.getElementById('formLogoValue').value = logoBase64;
            document.getElementById('logoPreview').outerHTML = '<div id="logoPreview"><img src="' + logoBase64 + '" class="w-12 h-12 rounded-lg object-contain" /></div>';
            const zone = document.getElementById('clipboardPasteZone');
            zone.innerHTML = '<svg class="w-5 h-5 mb-1 text-green-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/></svg><span class="text-xs text-green-400">图片已粘贴</span>';
          };
          reader.readAsDataURL(file); return;
        }
      }
    }

    function resetLogoPreview() {
      const p = document.getElementById('logoPreview');
      if (p) p.outerHTML = '<div id="logoPreview" class="logo-fallback">?</div>';
    }

    // ========== OFFICIAL: Add/Edit Modal ==========
    function openAddModal() {
      document.getElementById('modalTitle').textContent = '添加品牌';
      document.getElementById('formEditId').value = '';
      document.getElementById('formNameEn').value = '';
      document.getElementById('formNameCn').value = '';
      document.getElementById('formUrl').value = '';
      document.getElementById('formRegion').value = '全球';
      document.getElementById('formType').value = 'official';
      document.getElementById('formUrlLabel').textContent = '官网地址 *';
      document.getElementById('formCountryWrap').classList.add('hidden');
      document.getElementById('formLogoValue').value = '';
      document.getElementById('formLogoUrl').value = '';
      logoBase64 = '';
      resetLogoPreview();
      switchLogoMode('url');
      const zone = document.getElementById('clipboardPasteZone');
      zone.innerHTML = '<svg class="w-5 h-5 mb-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"/></svg><span class="text-xs">Ctrl+V 粘贴图片</span><span class="text-[10px] text-gray-500 mt-0.5">或点击此区域后粘贴</span>';
      document.getElementById('brandModal').classList.remove('hidden');
      document.getElementById('brandModal').classList.add('flex');
    }

    function openEditModal(id) {
      const brand = allBrands.find(b => b.id === id); if (!brand) return;
      document.getElementById('modalTitle').textContent = '编辑品牌';
      document.getElementById('formEditId').value = id;
      document.getElementById('formNameEn').value = brand.name_en;
      document.getElementById('formNameCn').value = brand.name_cn || '';
      document.getElementById('formUrl').value = brand.url;
      document.getElementById('formRegion').value = brand.region;
      document.getElementById('formType').value = 'official';
      document.getElementById('formUrlLabel').textContent = '官网地址 *';
      document.getElementById('formCountryWrap').classList.add('hidden');
      logoBase64 = '';
      if (brand.logo) {
        document.getElementById('formLogoValue').value = brand.logo;
        if (brand.logo.startsWith('http')) {
          document.getElementById('formLogoUrl').value = brand.logo;
          switchLogoMode('url');
          document.getElementById('logoPreview').outerHTML = '<div id="logoPreview"><img src="' + escapeHtml(brand.logo) + '" class="w-12 h-12 rounded-lg object-contain" onerror="this.style.display=\'none\'" /></div>';
        } else {
          switchLogoMode('upload');
          document.getElementById('logoPreview').outerHTML = '<div id="logoPreview"><img src="' + brand.logo + '" class="w-12 h-12 rounded-lg object-contain" /></div>';
        }
      } else {
        document.getElementById('formLogoValue').value = '';
        document.getElementById('formLogoUrl').value = '';
        resetLogoPreview();
        switchLogoMode('url');
      }
      document.getElementById('brandModal').classList.remove('hidden');
      document.getElementById('brandModal').classList.add('flex');
    }

    function closeModal() {
      document.getElementById('brandModal').classList.add('hidden');
      document.getElementById('brandModal').classList.remove('flex');
    }

    function onFormSubmit(e) {
      e.preventDefault();
      const editId = document.getElementById('formEditId').value;
      const nameEn = document.getElementById('formNameEn').value.trim();
      const nameCn = document.getElementById('formNameCn').value.trim();
      const url = document.getElementById('formUrl').value.trim();
      const region = document.getElementById('formRegion').value;
      const type = document.getElementById('formType').value;
      const country = document.getElementById('formCountry') ? document.getElementById('formCountry').value.trim() : '';
      const logoVal = logoBase64 || document.getElementById('formLogoValue').value || '';

      if (!nameEn || !url) return;

      if (type === 'shop') {
        saveShopBrand(editId, nameEn, nameCn, url, region, country, logoVal);
        return;
      }

      // Official brand
      if (editId) {
        const numId = Number(editId);
        const idx = allBrands.findIndex(b => b.id === numId); if (idx === -1) return;
        allBrands[idx].name_en = nameEn; allBrands[idx].name_cn = nameCn; allBrands[idx].url = url; allBrands[idx].region = region;
        if (logoVal) allBrands[idx].logo = logoVal;
        const userBrands = JSON.parse(localStorage.getItem('userBrands') || '[]');
        const ubIdx = userBrands.findIndex(b => b.id === numId);
        if (ubIdx !== -1) { userBrands[ubIdx] = { ...allBrands[idx] }; localStorage.setItem('userBrands', JSON.stringify(userBrands)); }
        else { const overrides = JSON.parse(localStorage.getItem('brandOverrides') || '{}'); overrides[numId] = { ...allBrands[idx] }; localStorage.setItem('brandOverrides', JSON.stringify(overrides)); }
        allBrands.sort((a, b) => a.name_en.localeCompare(b.name_en, 'en'));
        closeModal(); renderBrands(); showToast('品牌修改成功！');
      } else {
        const newBrand = { id: Date.now(), name_en: nameEn, name_cn: nameCn, url, region, level: 3, logo: logoVal };
        const userBrands = JSON.parse(localStorage.getItem('userBrands') || '[]');
        userBrands.push(newBrand); localStorage.setItem('userBrands', JSON.stringify(userBrands));
        allBrands.push(newBrand); allBrands.sort((a, b) => a.name_en.localeCompare(b.name_en, 'en'));
        closeModal(); buildLetterFilter(); renderBrands(); showToast('品牌添加成功！');
      }
    }

    // ========== SHOP: Add/Edit ==========
    function openShopAddModal() {
      document.getElementById('modalTitle').textContent = '添加商城';
      document.getElementById('formEditId').value = '';
      document.getElementById('formNameEn').value = '';
      document.getElementById('formNameCn').value = '';
      document.getElementById('formUrl').value = '';
      document.getElementById('formRegion').value = '全球';
      document.getElementById('formType').value = 'shop';
      document.getElementById('formUrlLabel').textContent = '商城地址 *';
      document.getElementById('formCountryWrap').classList.remove('hidden');
      document.getElementById('formCountry').value = '';
      document.getElementById('formLogoValue').value = '';
      document.getElementById('formLogoUrl').value = '';
      logoBase64 = '';
      resetLogoPreview();
      switchLogoMode('url');
      document.getElementById('brandModal').classList.remove('hidden');
      document.getElementById('brandModal').classList.add('flex');
    }

    function openShopEditModal(id) {
      const brand = shopBrands.find(b => b.id === id); if (!brand) return;
      document.getElementById('modalTitle').textContent = '编辑商城';
      document.getElementById('formEditId').value = id;
      document.getElementById('formNameEn').value = brand.name_en;
      document.getElementById('formNameCn').value = brand.name_cn || '';
      document.getElementById('formUrl').value = brand.url;
      document.getElementById('formRegion').value = brand.region;
      document.getElementById('formType').value = 'shop';
      document.getElementById('formUrlLabel').textContent = '商城地址 *';
      document.getElementById('formCountryWrap').classList.remove('hidden');
      document.getElementById('formCountry').value = brand.country || '';
      logoBase64 = '';
      if (brand.logo) {
        document.getElementById('formLogoValue').value = brand.logo;
        if (brand.logo.startsWith('http')) { document.getElementById('formLogoUrl').value = brand.logo; switchLogoMode('url'); document.getElementById('logoPreview').outerHTML = '<div id="logoPreview"><img src="' + escapeHtml(brand.logo) + '" class="w-12 h-12 rounded-lg object-contain" onerror="this.style.display=\'none\'" /></div>'; }
        else { switchLogoMode('upload'); document.getElementById('logoPreview').outerHTML = '<div id="logoPreview"><img src="' + brand.logo + '" class="w-12 h-12 rounded-lg object-contain" /></div>'; }
      } else { resetLogoPreview(); switchLogoMode('url'); }
      document.getElementById('brandModal').classList.remove('hidden');
      document.getElementById('brandModal').classList.add('flex');
    }

    function saveShopBrand(editId, nameEn, nameCn, url, region, country, logo) {
      if (editId) {
        const numId = Number(editId);
        const idx = shopBrands.findIndex(b => b.id === numId); if (idx === -1) return;
        shopBrands[idx] = { ...shopBrands[idx], name_en: nameEn, name_cn: nameCn, url, region, country, logo };
        closeModal(); renderShopBrands(); showToast('商城修改成功！');
      } else {
        shopBrands.push({ id: Date.now(), name_en: nameEn, name_cn: nameCn, url, region, country, logo });
        closeModal(); renderShopBrands(); showToast('商城添加成功！');
      }
      localStorage.setItem('shopBrands', JSON.stringify(shopBrands));
    }

    // ========== GROUP: Add/Edit ==========
    function openGroupAddModal() {
      document.getElementById('groupModalTitle').textContent = '添加集团';
      document.getElementById('groupEditId').value = '';
      document.getElementById('groupName').value = '';
      document.getElementById('groupDesc').value = '';
      document.getElementById('groupUrl').value = '';
      document.getElementById('groupLogo').value = '';
      currentSubBrands = [];
      renderSelectedSubBrands();
      document.getElementById('groupModal').classList.remove('hidden');
      document.getElementById('groupModal').classList.add('flex');
    }

    function openGroupEditModal(id) {
      const group = groupData.find(g => g.id === id); if (!group) return;
      document.getElementById('groupModalTitle').textContent = '编辑集团';
      document.getElementById('groupEditId').value = id;
      document.getElementById('groupName').value = group.name;
      document.getElementById('groupDesc').value = group.desc || '';
      document.getElementById('groupUrl').value = group.url || '';
      document.getElementById('groupLogo').value = group.logo || '';
      currentSubBrands = (group.sub_brands || []).map(sb => ({...sb}));
      renderSelectedSubBrands();
      document.getElementById('groupModal').classList.remove('hidden');
      document.getElementById('groupModal').classList.add('flex');
    }

    function closeGroupModal() {
      document.getElementById('groupModal').classList.add('hidden');
      document.getElementById('groupModal').classList.remove('flex');
    }

    function searchSubBrands() {
      const query = document.getElementById('groupSubSearch').value.trim().toLowerCase();
      const container = document.getElementById('subBrandResults');
      if (!query) { container.classList.add('hidden'); return; }
      const results = allBrands.filter(b => b.name_en.toLowerCase().includes(query) || (b.name_cn && b.name_cn.toLowerCase().includes(query))).slice(0, 10);
      if (!results.length) { container.classList.add('hidden'); return; }
      let html = '';
      results.forEach(b => {
        const already = currentSubBrands.some(sb => sb.name === b.name_en);
        html += `<div class="px-3 py-2 hover:bg-white/10 cursor-pointer flex items-center gap-2 ${already ? 'opacity-50' : ''}" onclick="addSubBrand(${b.id})">`;
        if (b.logo) html += `<img src="${escapeHtml(b.logo)}" class="w-5 h-5 rounded object-contain" onerror="this.style.display='none'" />`;
        html += `<span class="text-sm text-white">${escapeHtml(b.name_en)}</span>${b.name_cn ? `<span class="text-xs text-gray-400">${escapeHtml(b.name_cn)}</span>` : ''}${already ? '<span class="text-xs text-green-400">已添加</span>' : ''}</div>`;
      });
      container.innerHTML = html;
      container.classList.remove('hidden');
    }

    function addSubBrand(brandId) {
      const brand = allBrands.find(b => b.id === brandId); if (!brand) return;
      if (currentSubBrands.some(sb => sb.name === brand.name_en)) return;
      currentSubBrands.push({ name: brand.name_en, url: brand.url, logo: brand.logo || '' });
      document.getElementById('groupSubSearch').value = '';
      document.getElementById('subBrandResults').classList.add('hidden');
      renderSelectedSubBrands();
    }

    function addManualSubBrand() {
      const name = document.getElementById('manualSubName').value.trim();
      const url = document.getElementById('manualSubUrl').value.trim();
      if (!name) return;
      currentSubBrands.push({ name, url: url || '', logo: '' });
      document.getElementById('manualSubName').value = '';
      document.getElementById('manualSubUrl').value = '';
      renderSelectedSubBrands();
    }

    function removeSubBrand(index) {
      currentSubBrands.splice(index, 1);
      renderSelectedSubBrands();
    }

    function renderSelectedSubBrands() {
      const container = document.getElementById('selectedSubBrands');
      if (!currentSubBrands.length) { container.innerHTML = '<span class="text-xs text-gray-500">暂无关联子品牌</span>'; return; }
      let html = '';
      currentSubBrands.forEach((sb, i) => {
        html += `<span class="inline-flex items-center gap-1 px-2 py-1 rounded-lg bg-blue-500/20 text-blue-300 text-xs">${escapeHtml(sb.name)}<button type="button" onclick="removeSubBrand(${i})" class="ml-1 text-red-400 hover:text-red-300">&times;</button></span>`;
      });
      container.innerHTML = html;
    }

    function onGroupFormSubmit(e) {
      e.preventDefault();
      const editId = document.getElementById('groupEditId').value;
      const name = document.getElementById('groupName').value.trim();
      const desc = document.getElementById('groupDesc').value.trim();
      const url = document.getElementById('groupUrl').value.trim();
      const logo = document.getElementById('groupLogo').value.trim();

      if (!name) return;

      if (editId) {
        const numId = Number(editId);
        const idx = groupData.findIndex(g => g.id === numId); if (idx === -1) return;
        groupData[idx] = { ...groupData[idx], name, desc, url, logo, sub_brands: [...currentSubBrands] };
        closeGroupModal(); renderGroups(); showToast('集团修改成功！');
      } else {
        groupData.push({ id: Date.now(), name, desc, url, logo, sub_brands: [...currentSubBrands] });
        closeGroupModal(); renderGroups(); showToast('集团添加成功！');
      }
      localStorage.setItem('groupData', JSON.stringify(groupData));
    }

    // ========== Delete ==========
    function openDeleteModal(id, name, type) {
      deleteTargetId = id;
      deleteTargetType = type;
      document.getElementById('deleteBrandName').textContent = `确定要删除「${name}」吗？此操作不可撤销。`;
      document.getElementById('deleteModal').classList.remove('hidden');
      document.getElementById('deleteModal').classList.add('flex');
    }

    function closeDeleteModal() {
      document.getElementById('deleteModal').classList.add('hidden');
      document.getElementById('deleteModal').classList.remove('flex');
      deleteTargetId = null; deleteTargetType = '';
    }

    function onConfirmDelete() {
      if (!deleteTargetId) return;
      if (deleteTargetType === 'official') {
        allBrands = allBrands.filter(b => b.id !== deleteTargetId);
        const userBrands = JSON.parse(localStorage.getItem('userBrands') || '[]');
        const ubIdx = userBrands.findIndex(b => b.id === deleteTargetId);
        if (ubIdx !== -1) { userBrands.splice(ubIdx, 1); localStorage.setItem('userBrands', JSON.stringify(userBrands)); }
        else { const deletedIds = JSON.parse(localStorage.getItem('deletedBrands') || '[]'); deletedIds.push(deleteTargetId); localStorage.setItem('deletedBrands', JSON.stringify(deletedIds)); }
        closeDeleteModal(); buildLetterFilter(); renderBrands(); showToast('品牌已删除');
      } else if (deleteTargetType === 'shop') {
        shopBrands = shopBrands.filter(b => b.id !== deleteTargetId);
        localStorage.setItem('shopBrands', JSON.stringify(shopBrands));
        closeDeleteModal(); renderShopBrands(); showToast('商城已删除');
      } else if (deleteTargetType === 'group') {
        groupData = groupData.filter(g => g.id !== deleteTargetId);
        localStorage.setItem('groupData', JSON.stringify(groupData));
        closeDeleteModal(); renderGroups(); showToast('集团已删除');
      }
    }

    // ========== Export ==========
    function doExport() {
      try {
        const dataStr = JSON.stringify(allBrands, null, 2);
        const blob = new Blob([dataStr], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = 'brands_data.json';
        document.body.appendChild(a);
        a.click();
        setTimeout(() => { document.body.removeChild(a); URL.revokeObjectURL(url); }, 200);
        showToast('官网数据导出成功！');
      } catch(err) { showToast('导出失败：' + err.message); }
    }

    function doShopExport() {
      try {
        const dataStr = JSON.stringify(shopBrands, null, 2);
        const blob = new Blob([dataStr], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = 'shop_data.json';
        document.body.appendChild(a);
        a.click();
        setTimeout(() => { document.body.removeChild(a); URL.revokeObjectURL(url); }, 200);
        showToast('商城数据导出成功！');
      } catch(err) { showToast('导出失败：' + err.message); }
    }

    function doGroupExport() {
      try {
        const dataStr = JSON.stringify(groupData, null, 2);
        const blob = new Blob([dataStr], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = 'group_data.json';
        document.body.appendChild(a);
        a.click();
        setTimeout(() => { document.body.removeChild(a); URL.revokeObjectURL(url); }, 200);
        showToast('集团数据导出成功！');
      } catch(err) { showToast('导出失败：' + err.message); }
    }

    // ========== Toast ==========
    function showToast(msg) {
      const toast = document.getElementById('toast');
      toast.textContent = msg;
      toast.classList.remove('hidden');
      setTimeout(() => toast.classList.add('hidden'), 2500);
    }

    // ========== Start ==========
    document.addEventListener('DOMContentLoaded', init);
  </script>
</body>
</html>
